image:
  registry: ghcr.io
  repositoryApi: your-org/opensig-api
  repositoryWeb: your-org/opensig-web
  tag: latest
  pullPolicy: IfNotPresent

api:
  replicas: 1
  servicePort: 8080

web:
  replicas: 1
  servicePort: 3000

ingress:
  enabled: false
  className: ""
  hosts:
    - host: opensig.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
